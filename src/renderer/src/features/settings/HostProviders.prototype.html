<!doctype html>
<!--
  PROTOTYPE, throwaway. Not part of the app; never imported.
  Question: how does a remote host's own providers read in Settings > Hosts, as an expansion under the
  host's row, so everything on forge can be connected from this computer?
  Decided before this prototype: providers show per machine as an expansion under the host; the host
  connects every provider that is installed and signed in when it starts; a provider that is not signed
  in offers Sign in from here (the provider's page opens in this computer's browser; Codex and Grok Build
  show a device code, Claude Code takes a code pasted back); the host finds CLIs where version managers
  put them.
  Three layouts, switchable with ?variant=A|B|C, the bar at the bottom, or the arrow keys:
    A  Disclosure list: a Providers line under the host opens a list; sign-in unfolds under its row.
    B  Tiles: the expansion is a grid of four provider tiles; sign-in opens a small dialog.
    C  Needs you first: the collapsed row already says what needs you; the expansion groups providers
       by what they need, and sign-in is a checklist like Add host's.
  T switches theme, R resets. The provider data is forge's real state on September 28, 2026.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · A host's providers under its row</title>
<style>
@font-face { font-family: Figtree; src: url('../../assets/fonts/figtree-latin.woff2') format('woff2'); font-weight: 300 900; }
:root, [data-theme='dark'] {
  --tt-room: #111214; --tt-surface-elevated: #1c1d20; --tt-surface-sunken: #0f1012; --tt-surface-overlay: #232428;
  --tt-hairline: rgba(255,255,255,.09); --tt-border: rgba(255,255,255,.16); --tt-border-faint: rgba(255,255,255,.08);
  --tt-text: #f3f3f4; --tt-text-2: #d6d7da; --tt-text-muted: #a3a5ab; --tt-text-faint: #8a8d94;
  --tt-accent: #8fb4ff; --tt-accent-text: #a9c4ff; --tt-success: #6fcf97; --tt-error: #e8868f;
  --tt-pill: #f5f5f6; --tt-pill-ink: #111214; --tt-overlay: rgba(0,0,0,.55); --tt-focus-ring: #8fb4ff;
  --tt-hover: rgba(255,255,255,.06); --tt-selected: rgba(143,180,255,.12);
  --tt-shadow-lg: 0 24px 60px rgba(0,0,0,.5);
}
[data-theme='light'] {
  --tt-room: #eceae6; --tt-surface-elevated: #ffffff; --tt-surface-sunken: #f1f0ec; --tt-surface-overlay: #ffffff;
  --tt-hairline: rgba(0,0,0,.1); --tt-border: rgba(0,0,0,.2); --tt-border-faint: rgba(0,0,0,.1);
  --tt-text: #17181a; --tt-text-2: #2c2d30; --tt-text-muted: #55585f; --tt-text-faint: #65686f;
  --tt-accent: #2f5fcf; --tt-accent-text: #2451b8; --tt-success: #1f8a4c; --tt-error: #c23b47;
  --tt-pill: #17181a; --tt-pill-ink: #ffffff; --tt-overlay: rgba(20,20,20,.35); --tt-focus-ring: #2f5fcf;
  --tt-hover: rgba(0,0,0,.05); --tt-selected: rgba(47,95,207,.08);
  --tt-shadow-lg: 0 24px 60px rgba(0,0,0,.18);
}
:root { --tt-radius-sm: 6px; --tt-radius-md: 10px; --tt-radius-pill: 999px; --tt-font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--tt-room); color: var(--tt-text); font: 14px/1.45 Figtree, system-ui, sans-serif; }
:focus-visible { outline: 3px solid var(--tt-focus-ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none !important; } }

/* Settings > Hosts, as it is today. */
.page { max-width: 760px; margin: 0 auto; padding: 48px 32px 140px; display: grid; gap: 20px; }
.page h3 { margin: 0; font-size: 18px; font-weight: 600; }
.page p { margin: 6px 0 0; color: var(--tt-text-muted); font-size: 14px; }
.local { display: flex; align-items: flex-start; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--tt-hairline); }
.local .copy { flex: 1; min-width: 0; max-width: 470px; }
.heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.ico { display: grid; flex: 0 0 auto; place-items: center; width: 34px; height: 34px; border-radius: var(--tt-radius-sm); background: var(--tt-surface-sunken); color: var(--tt-accent-text); }
.ico.local-ico { color: var(--tt-text-muted); }
.hosts { display: grid; }
.hrow { border-bottom: 1px solid var(--tt-hairline); }
.hosts > .hrow:first-child { border-top: 1px solid var(--tt-hairline); }
.hrow-main { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 14px 0; }
.info { flex: 1 1 220px; min-width: 0; }
.info h4 { margin: 0; font-size: 15px; font-weight: 600; }
.page .meta { margin-top: 2px; font-size: 13px; }
.meta .on { color: var(--tt-text); }
.acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; margin-left: auto; }
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--tt-text-muted); font-size: 13px; }
.track { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--tt-accent); border: 0; cursor: pointer; }
.track::after { content: ''; position: absolute; top: 3px; left: 19px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-pill-ink); }
.track[aria-checked='false'] { background: var(--tt-border); } .track[aria-checked='false']::after { left: 3px; }

.button { display: inline-flex; min-height: 32px; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); padding: 0 14px; background: transparent; color: var(--tt-text-2); cursor: pointer; font: 500 13px Figtree, system-ui, sans-serif; white-space: nowrap; }
.button:hover:not(:disabled) { border-color: var(--tt-text-faint); color: var(--tt-text); }
.button:disabled { cursor: not-allowed; opacity: .45; }
.button.primary { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.button.ghost { border-color: transparent; }
.button.icon { width: 32px; padding: 0; }
.link { color: var(--tt-accent-text); font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; }
.muted { color: var(--tt-text-muted); } .faint { color: var(--tt-text-faint); }
.spin { display: inline-block; animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tt-text-faint); flex: 0 0 auto; }
.dot.on { background: var(--tt-success); } .dot.need { background: var(--tt-accent); } .dot.off { background: transparent; border: 1.5px solid var(--tt-text-faint); }
.mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--tt-radius-sm); background: var(--tt-surface-sunken); color: var(--tt-text-2); font-size: 11px; font-weight: 700; flex: 0 0 auto; }
.code { font: 600 22px/1 var(--tt-font-mono); letter-spacing: .12em; color: var(--tt-text); }
.input { width: 100%; min-height: 36px; border: 1px solid var(--tt-border-faint); border-radius: var(--tt-radius-md); background: var(--tt-surface-sunken); padding: 4px 12px; color: var(--tt-text); font: 500 13.5px Figtree, system-ui, sans-serif; }
.label { font-size: 13px; font-weight: 600; }
.desc { margin: 0; color: var(--tt-text-muted); font-size: 12px; }
.notice { display: grid; gap: 10px; border-left: 2px solid var(--tt-accent); border-radius: var(--tt-radius-sm); background: var(--tt-surface-sunken); padding: 12px 14px; font-size: 13px; }
.notice p { margin: 0 !important; color: var(--tt-text) !important; font-size: 13px !important; }
.notice .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.notice.done { border-left-color: var(--tt-success); }

/* A: the disclosure list. */
.a-toggle { display: flex; align-items: center; gap: 8px; width: 100%; margin: -4px 0 0; padding: 6px 0 12px 48px; border: 0; background: none; color: var(--tt-text-muted); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.a-toggle:hover { color: var(--tt-text); }
.a-toggle .chev { transition: transform .15s; } .a-toggle[aria-expanded='true'] .chev { transform: rotate(90deg); }
.a-list { display: grid; margin: 0 0 14px 48px; border-left: 1px solid var(--tt-hairline); }
.a-prov { display: grid; gap: 10px; padding: 10px 0 10px 16px; }
.a-prov + .a-prov { border-top: 1px solid var(--tt-border-faint); }
.a-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.a-line .name { font-weight: 600; font-size: 14px; }
.a-line .state { font-size: 13px; color: var(--tt-text-muted); }
.a-line .acts { margin-left: auto; }
.a-foot { padding: 8px 0 0 16px; font-size: 12px; color: var(--tt-text-faint); }

/* B: tiles. */
.b-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 0 0 16px 48px; }
.b-tile { display: grid; gap: 8px; align-content: start; min-height: 128px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface-elevated); padding: 12px; }
.b-tile[data-state='missing'] { background: transparent; border-style: dashed; }
.b-tile .top { display: flex; align-items: center; gap: 10px; }
.b-tile .name { font-weight: 600; }
.b-tile .state { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tt-text-muted); }
.b-tile .detail { font-size: 12px; color: var(--tt-text-faint); }
.b-tile .button { justify-self: start; margin-top: auto; }
.b-toggle { margin-left: 48px; }
.backdrop { position: fixed; inset: 0; display: grid; place-items: center; background: var(--tt-overlay); padding: 20px 20px 90px; z-index: 30; }
.dialog { width: min(440px, 100%); border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); padding: 24px; display: grid; gap: 14px; }
.dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dialog .dacts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

/* C: needs you first. */
.c-panel { display: grid; gap: 16px; margin: 0 0 16px 48px; }
.c-group h5 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tt-text-faint); }
.c-item { display: grid; gap: 10px; padding: 10px 0; border-top: 1px solid var(--tt-border-faint); }
.c-item:first-of-type { border-top: 0; }
.c-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.c-line .name { font-weight: 600; }
.c-line .acts { margin-left: auto; }
.steps { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; font-size: 13px; }
.steps .n { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--tt-border); font-size: 11px; color: var(--tt-text-muted); }
.steps li[data-s='done'] .n { border-color: var(--tt-success); background: var(--tt-success); color: var(--tt-pill-ink); }
.steps li[data-s='now'] .n { border-color: var(--tt-accent); color: var(--tt-accent-text); }
.steps li[data-s='later'] { color: var(--tt-text-faint); }
.steps .body { display: grid; gap: 8px; }
.c-compact { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--tt-text-muted); }
.c-compact span { display: inline-flex; align-items: center; gap: 6px; }

/* The prototype's own bar, not part of the design. */
.proto-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #000; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.5); font: 600 13px system-ui, sans-serif; z-index: 50; }
.proto-bar button, .proto-bar select { border: 0; border-radius: 999px; background: #262626; color: #fff; padding: 7px 12px; font: inherit; cursor: pointer; }
.proto-bar .label { min-width: 250px; text-align: center; font-weight: 600; }
.proto-note { font: 12px system-ui, sans-serif; color: #fc6; background: rgba(255,200,80,.1); border: 1px dashed rgba(255,200,80,.5); border-radius: 6px; padding: 2px 6px; }
</style>
</head>
<body>
<main class="page" id="page"></main>
<div class="proto-bar" role="toolbar" aria-label="Prototype controls">
  <button type="button" id="prev" aria-label="Previous layout">←</button>
  <span class="label" id="vlabel"></span>
  <button type="button" id="next" aria-label="Next layout">→</button>
  <select id="moment" aria-label="Moment">
    <option value="today">forge today</option>
    <option value="all">Everything connected</option>
    <option value="down">forge not connected</option>
  </select>
  <button type="button" id="reset">Reset</button>
  <button type="button" id="theme">Theme</button>
</div>
<script>
const VARIANTS = { A: 'Disclosure list', B: 'Tiles', C: 'Needs you first' }
const KEYS = Object.keys(VARIANTS)
const params = new URLSearchParams(location.search)
let variant = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A'
let moment = 'today'
let state

/* forge's real state: Claude Code installed, not signed in; Codex signed in with ChatGPT and connected; Grok Build installed, not signed in; Devin not installed. */
function fresh(which) {
  const p = {
    claude: { name: 'Claude Code', mark: 'CC', version: '2.1.281', installed: true, signedIn: false, connected: false, kind: 'paste', page: 'claude.ai', account: 'Claude subscription' },
    codex: { name: 'Codex', mark: 'Cx', version: '0.155.1', installed: true, signedIn: true, connected: true, kind: 'device', page: 'auth.openai.com', account: 'ChatGPT' },
    grok: { name: 'Grok Build', mark: 'Gk', version: '1.0.41', installed: true, signedIn: false, connected: false, kind: 'device', page: 'auth.x.ai', account: 'X account' },
    devin: { name: 'Devin', mark: 'Dv', version: '', installed: false, signedIn: false, connected: false, kind: 'device', page: 'app.devin.ai', account: 'Devin account' },
  }
  if (which === 'all') for (const id of ['claude', 'grok']) Object.assign(p[id], { signedIn: true, connected: true })
  return { hostUp: which !== 'down', open: variant === 'C' || which !== 'down', providers: p, signin: null, dialog: null }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const list = () => Object.entries(state.providers)
const connectedCount = () => list().filter(([, v]) => v.connected).length
const installedCount = () => list().filter(([, v]) => v.installed).length

/** One sentence per provider, the same in every layout. */
function stateLine(v) {
  if (!v.installed) return 'Not installed on forge'
  if (v.connected) return `Connected · signed in with ${v.account} · ${v.version}`
  if (v.signedIn) return `Signed in · switched off · ${v.version}`
  return `Not signed in on forge · ${v.version}`
}
function dotClass(v) { return v.connected ? 'on' : v.installed && !v.signedIn ? 'need' : v.installed ? 'off' : '' }
function action(id, v, style = '') {
  if (!v.installed) return `<button type="button" class="button ${style}" data-act="check" data-id="${id}" aria-label="Check forge for ${v.name} again">Check again</button>`
  if (v.connected) return `<button type="button" class="button ghost ${style}" data-act="disconnect" data-id="${id}" aria-label="Disconnect ${v.name} on forge">Disconnect</button>`
  if (v.signedIn) return `<button type="button" class="button ${style}" data-act="connect" data-id="${id}" aria-label="Connect ${v.name} on forge">Connect</button>`
  if (state.signin?.id === id) return `<button type="button" class="button ghost ${style}" data-act="cancel" data-id="${id}">Cancel</button>`
  return `<button type="button" class="button primary ${style}" data-act="signin" data-id="${id}" aria-label="Sign in to ${v.name} on forge from this computer">Sign in</button>`
}

/** The sign-in steps. Device code: Sotto shows forge's code, you enter it on the provider's page here. Paste back: you sign in here and paste the page's code into Sotto, which hands it to forge. */
function signinBody(id, v) {
  const s = state.signin
  if (!s || s.id !== id) return ''
  if (s.step === 'starting') return `<div class="notice"><p><span class="spin">◌</span> Starting ${esc(v.name)}'s sign-in on forge…</p></div>`
  if (s.step === 'finishing') return `<div class="notice"><p><span class="spin">◌</span> Finishing sign-in on forge, then connecting ${esc(v.name)}…</p></div>`
  if (s.step === 'failed') return `<div class="notice" style="border-left-color:var(--tt-error)"><p>${esc(v.name)} did not accept that code, so forge is still not signed in. Open the sign-in page again for a new code.</p><div class="row"><button type="button" class="button" data-act="signin" data-id="${id}">Try again</button></div></div>`
  if (v.kind === 'device') return `<div class="notice">
    <p>Enter this code on ${esc(v.name)}'s sign-in page. forge finishes signing in by itself once you do.</p>
    <div class="row"><span class="code" aria-label="Code ${s.code.split('').join(' ')}">${s.code}</span><button type="button" class="button" data-act="copy">Copy code</button></div>
    <div class="row"><button type="button" class="button primary" data-act="open" data-id="${id}">Open sign-in page</button><span class="muted"><span class="spin">◌</span> Waiting for you on ${esc(v.page)}. The code lasts 15 minutes.</span></div>
    <div class="row"><button type="button" class="link" data-act="sim-done" data-id="${id}">Prototype: act as if the code was entered</button></div>
  </div>`
  return `<div class="notice">
    <p>${esc(v.name)} signs in with your ${esc(v.account)} in this computer's browser, then shows a code to bring back here.</p>
    <div class="row"><button type="button" class="button ${s.opened ? '' : 'primary'}" data-act="open" data-id="${id}">${s.opened ? 'Open sign-in page again' : 'Open sign-in page'}</button>${s.opened ? `<span class="muted">Opened ${esc(v.page)} in your browser.</span>` : ''}</div>
    ${s.opened ? `<label class="label" for="code-${id}">Code from the page</label>
    <div class="row"><input class="input" id="code-${id}" style="flex:1;min-width:180px" placeholder="Paste the code" value="${esc(s.pasted || '')}" data-input="${id}"><button type="button" class="button primary" data-act="finish" data-id="${id}" ${s.pasted ? '' : 'disabled'}>Finish sign-in</button></div>
    <p class="desc" style="color:var(--tt-text-muted)!important;font-size:12px!important">Sotto hands the code to Claude Code on forge and keeps nothing. Type <b>bad</b> to see a refused code.</p>` : ''}
  </div>`
}

function hostHead(extra = '') {
  const up = state.hostUp
  return `<div class="hrow-main">
    <span class="ico" aria-hidden="true">▤</span>
    <div class="info"><h4>forge</h4><p class="meta">SSH forge · <span class="${up ? 'on' : ''}">${up ? 'Connected' : 'Not connected'}</span>${extra}</p></div>
    <div class="acts"><span class="switch"><span>${up ? 'On' : 'Off'}</span><button type="button" class="track" role="switch" aria-checked="${up}" aria-label="Keep forge connected, now and when Sotto starts" data-act="host"></button></span><button type="button" class="button ghost icon" aria-label="More for forge">⋯</button></div>
  </div>`
}
const autoLine = 'forge connects each provider that is signed in when its host starts. A provider you disconnect stays off.'

function variantA() {
  const n = connectedCount(), m = installedCount()
  const summary = state.hostUp ? `Providers · ${n} of ${m} connected` : 'Providers · connect forge to see them'
  let body = ''
  if (state.open && state.hostUp) body = `<div class="a-list" id="a-list">${list().map(([id, v]) => `<div class="a-prov">
      <div class="a-line"><span class="dot ${dotClass(v)}" aria-hidden="true"></span><span class="name">${v.name}</span><span class="state">${stateLine(v)}</span><span class="acts">${action(id, v)}</span></div>
      ${signinBody(id, v)}</div>`).join('')}<p class="a-foot">${autoLine}</p></div>`
  return `<section class="hrow" aria-label="forge">${hostHead()}
    <button type="button" class="a-toggle" data-act="toggle" aria-expanded="${state.open && state.hostUp}" aria-controls="a-list" ${state.hostUp ? '' : 'disabled'}><span class="chev" aria-hidden="true">▸</span>${summary}</button>${body}</section>`
}

function variantB() {
  const n = connectedCount()
  const tiles = list().map(([id, v]) => `<div class="b-tile" data-state="${v.installed ? 'in' : 'missing'}">
      <div class="top"><span class="mark" aria-hidden="true">${v.mark}</span><span class="name">${v.name}</span></div>
      <div class="state"><span class="dot ${dotClass(v)}" aria-hidden="true"></span>${v.connected ? 'Connected' : !v.installed ? 'Not installed' : v.signedIn ? 'Switched off' : 'Not signed in'}</div>
      <div class="detail">${v.connected ? `${esc(v.account)} · ${v.version}` : v.installed ? v.version : 'Install it on forge, then check again.'}</div>
      ${action(id, v)}</div>`).join('')
  const expander = state.hostUp ? `<button type="button" class="button ghost b-toggle" data-act="toggle" aria-expanded="${state.open}">${state.open ? 'Hide providers' : `Show providers (${n} connected)`}</button>` : ''
  const grid = state.open && state.hostUp ? `<div class="b-grid">${tiles}</div><p class="faint" style="margin:-6px 0 16px 48px;font-size:12px">${autoLine}</p>` : ''
  let dialog = ''
  if (state.signin) {
    const v = state.providers[state.signin.id]
    dialog = `<div class="backdrop" data-act="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">Sign in to ${v.name} on forge</h2>
      ${signinBody(state.signin.id, v)}
      <div class="dacts"><button type="button" class="button" data-act="cancel" data-id="${state.signin.id}">Cancel</button></div></div></div>`
  }
  return `<section class="hrow" aria-label="forge">${hostHead(state.hostUp ? ` · ${n} provider${n === 1 ? '' : 's'}` : '')}${expander}${grid}</section>${dialog}`
}

function variantC() {
  const need = list().filter(([, v]) => v.installed && !v.connected)
  const on = list().filter(([, v]) => v.connected)
  const missing = list().filter(([, v]) => !v.installed)
  const needText = need.length ? ` · <span style="color:var(--tt-accent-text)">${need.map(([, v]) => v.name).join(' and ')} ${need.length === 1 ? 'needs' : 'need'} you</span>` : ''
  let panel = ''
  if (state.hostUp && state.open) {
    const needItems = need.map(([id, v]) => {
      const s = state.signin?.id === id ? state.signin : null
      const steps = v.signedIn ? '' : s ? `<ol class="steps">
          <li data-s="${s.step === 'starting' ? 'now' : 'done'}"><span class="n">1</span><div class="body">Start sign-in on forge</div></li>
          <li data-s="${['starting'].includes(s.step) ? 'later' : ['finishing'].includes(s.step) ? 'done' : 'now'}"><span class="n">2</span><div class="body">${v.kind === 'device' ? 'Enter the code on the sign-in page' : 'Sign in here and paste the code'}${['starting', 'finishing'].includes(s.step) ? '' : signinBody(id, v)}</div></li>
          <li data-s="${s.step === 'finishing' ? 'now' : 'later'}"><span class="n">3</span><div class="body">Connect ${v.name}${s.step === 'finishing' ? ' <span class="spin">◌</span>' : ''}</div></li></ol>` : ''
      return `<div class="c-item"><div class="c-line"><span class="dot ${dotClass(v)}" aria-hidden="true"></span><span class="name">${v.name}</span><span class="muted" style="font-size:13px">${stateLine(v)}</span><span class="acts">${action(id, v)}</span></div>${steps}</div>`
    }).join('')
    panel = `<div class="c-panel" id="c-panel">
      ${need.length ? `<div class="c-group"><h5>Needs you</h5>${needItems}</div>` : ''}
      ${on.length ? `<div class="c-group"><h5>Connected</h5>${on.map(([id, v]) => `<div class="c-item"><div class="c-line"><span class="dot on" aria-hidden="true"></span><span class="name">${v.name}</span><span class="muted" style="font-size:13px">${esc(v.account)} · ${v.version}</span><span class="acts">${action(id, v)}</span></div></div>`).join('')}</div>` : ''}
      ${missing.length ? `<div class="c-group"><h5>Not installed on forge</h5><div class="c-compact">${missing.map(([id, v]) => `<span>${v.name} <button type="button" class="link" data-act="check" data-id="${id}">Check again</button></span>`).join('')}</div></div>` : ''}
      <p class="faint" style="margin:0;font-size:12px">${autoLine}</p></div>`
  }
  const toggle = state.hostUp ? `<button type="button" class="a-toggle" data-act="toggle" aria-expanded="${state.open}" aria-controls="c-panel"><span class="chev" aria-hidden="true">▸</span>${state.open ? 'Hide providers' : 'Show providers'}</button>` : ''
  return `<section class="hrow" aria-label="forge">${hostHead(state.hostUp ? needText || ` · ${on.length} providers connected` : '')}${toggle}${panel}</section>`
}

function render() {
  const page = document.getElementById('page')
  const focusedId = document.activeElement?.dataset?.input
  page.innerHTML = `
    <div class="local"><span class="ico local-ico" aria-hidden="true">▭</span><div class="copy"><h3>This computer</h3><p>Runs threads on this computer beside your remote hosts. A change takes effect after you restart Sotto. Saved data stays.</p></div><span class="switch"><span>On</span><span class="track" aria-hidden="true"></span></span></div>
    <div class="local" style="padding-bottom:0;border:0"><span class="ico local-ico" aria-hidden="true">◇</span><div class="copy"><h3 style="font-size:15px">Tailscale</h3><p style="font-size:13px">Connected as millZach · 5 devices on your tailnet</p></div></div>
    <p>Dictation and automatic paste always use this computer. They do not paste into a remote host.</p>
    <div class="heading"><h3>Remote hosts</h3><button type="button" class="button">+ Add host</button></div>
    <p>Connect to machines you reach over SSH. Sotto signs in with your SSH setup, starts the host if needed and pairs this computer. Hosts that are on reconnect when Sotto starts, and a host Sotto started keeps running until you stop it.</p>
    <div class="hosts">${variant === 'A' ? variantA() : variant === 'B' ? variantB() : variantC()}</div>
    <p><span class="proto-note">Prototype</span> The provider data is forge's real state today. Sign-in is simulated.</p>`
  document.getElementById('vlabel').textContent = `${variant} — ${VARIANTS[variant]}`
  if (focusedId) { const input = document.querySelector(`[data-input="${focusedId}"]`); input?.focus(); input?.setSelectionRange(input.value.length, input.value.length) }
}

const later = (ms, fn) => setTimeout(() => { fn(); render() }, ms)
document.addEventListener('click', event => {
  const target = event.target.closest('[data-act]')
  if (!target) return
  const { act, id } = target.dataset
  const v = id && state.providers[id]
  if (act === 'backdrop' && event.target !== target) return
  if (act === 'toggle') state.open = !state.open
  else if (act === 'host') { state.hostUp = !state.hostUp; state.signin = null }
  else if (act === 'connect') { v.connected = true }
  else if (act === 'disconnect') { v.connected = false }
  else if (act === 'check') { /* Nothing new on forge. */ target.textContent = 'Still not installed'; return }
  else if (act === 'signin') { state.signin = { id, step: 'starting', code: 'WDJB-MJHT' }; later(900, () => { if (state.signin?.id === id) state.signin.step = 'code' }) }
  else if (act === 'cancel' || act === 'backdrop') state.signin = null
  else if (act === 'open') { state.signin.opened = true }
  else if (act === 'copy') { target.textContent = 'Copied'; return }
  else if (act === 'sim-done' || act === 'finish') {
    if (act === 'finish' && /bad/i.test(state.signin.pasted || '')) { state.signin.step = 'failed' }
    else { state.signin.step = 'finishing'; later(1200, () => { v.signedIn = true; v.connected = true; state.signin = null }) }
  }
  render()
})
document.addEventListener('input', event => { const id = event.target.dataset.input; if (id && state.signin?.id === id) { state.signin.pasted = event.target.value; const button = document.querySelector(`[data-act="finish"][data-id="${id}"]`); if (button) button.disabled = !event.target.value } })
function go(step) { variant = KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length]; history.replaceState(null, '', `?variant=${variant}`); state = fresh(moment); render() }
document.getElementById('prev').onclick = () => go(-1)
document.getElementById('next').onclick = () => go(1)
document.getElementById('reset').onclick = () => { state = fresh(moment); render() }
document.getElementById('moment').onchange = event => { moment = event.target.value; state = fresh(moment); render() }
document.getElementById('theme').onclick = () => { const html = document.documentElement; html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark' }
document.addEventListener('keydown', event => {
  if (event.target.closest('input, textarea, select, [contenteditable]')) return
  if (event.key === 'ArrowLeft') go(-1)
  else if (event.key === 'ArrowRight') go(1)
  else if (event.key === 't' || event.key === 'T') document.getElementById('theme').click()
  else if (event.key === 'r' || event.key === 'R') document.getElementById('reset').click()
  else if (event.key === 'Escape' && state.signin && variant === 'B') { state.signin = null; render() }
})
state = fresh(moment)
render()
</script>
</body>
</html>
