<!doctype html>
<!--
  PROTOTYPE, throwaway. Not part of the app; never imported.
  Round 3. Round 1 picked the checklist (A); round 2 picked "choose first" (A2) for letting an agent set a
  host up. Question now: how do the device list and Connect to Tailscale read, on the Hosts page and in
  Add host?
  Decided: the host field is a list of the devices Sotto can see (this computer's Tailscale status and SSH
  setup), all of them, unusable ones greyed with the reason; a device in both shows once with both tags;
  "Another SSH host" is the last entry and turns into a text field. Connect to Tailscale shows on the Hosts
  page and in the dialog when Tailscale on this computer is off; Get Tailscale when it is not installed.
  Moments: 1 Hosts page, 2 Pick a device, 3 Tailscale off, 4 No Tailscale, 5 Another SSH host,
  6 Agent working, 7 Done. Keys: 1 to 7 switch moment, T switches theme.
  The device data is this computer's real Tailscale status on September 27, 2026.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Add host from the devices Sotto can see</title>
<style>
@font-face { font-family: Figtree; src: url('../../assets/fonts/figtree-latin.woff2') format('woff2'); font-weight: 300 900; }
:root, [data-theme='dark'] {
  --tt-room: #111214; --tt-surface-elevated: #1c1d20; --tt-surface-sunken: #0f1012; --tt-surface-overlay: #232428;
  --tt-hairline: rgba(255,255,255,.09); --tt-border: rgba(255,255,255,.16); --tt-border-faint: rgba(255,255,255,.08);
  --tt-text: #f3f3f4; --tt-text-2: #d6d7da; --tt-text-muted: #a3a5ab; --tt-text-faint: #8a8d94;
  --tt-accent: #8fb4ff; --tt-accent-text: #a9c4ff; --tt-success: #6fcf97;
  --tt-error: #e8868f; --tt-pill: #f5f5f6; --tt-pill-ink: #111214;
  --tt-overlay: rgba(0,0,0,.55); --tt-focus-ring: #8fb4ff; --tt-hover: rgba(255,255,255,.06); --tt-selected: rgba(143,180,255,.12);
  --tt-shadow-lg: 0 24px 60px rgba(0,0,0,.5); --tt-shadow-overlay: 0 12px 32px rgba(0,0,0,.45);
}
[data-theme='light'] {
  --tt-room: #eceae6; --tt-surface-elevated: #ffffff; --tt-surface-sunken: #f1f0ec; --tt-surface-overlay: #ffffff;
  --tt-hairline: rgba(0,0,0,.1); --tt-border: rgba(0,0,0,.2); --tt-border-faint: rgba(0,0,0,.1);
  --tt-text: #17181a; --tt-text-2: #2c2d30; --tt-text-muted: #55585f; --tt-text-faint: #65686f;
  --tt-accent: #2f5fcf; --tt-accent-text: #2451b8; --tt-success: #1f8a4c;
  --tt-error: #c23b47; --tt-pill: #17181a; --tt-pill-ink: #ffffff;
  --tt-overlay: rgba(20,20,20,.35); --tt-focus-ring: #2f5fcf; --tt-hover: rgba(0,0,0,.05); --tt-selected: rgba(47,95,207,.08);
  --tt-shadow-lg: 0 24px 60px rgba(0,0,0,.18); --tt-shadow-overlay: 0 12px 32px rgba(0,0,0,.14);
}
:root { --tt-radius-sm: 6px; --tt-radius-md: 10px; --tt-radius-pill: 999px; --tt-font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--tt-room); color: var(--tt-text); font: 14px/1.45 Figtree, system-ui, sans-serif; }
:focus-visible { outline: 3px solid var(--tt-focus-ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none !important; } }

/* Settings > Hosts. */
.page { max-width: 760px; margin: 0 auto; padding: 48px 32px 120px; }
.page .heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.page h3 { margin: 0; font-size: 18px; font-weight: 600; }
.page p { margin: 6px 0 0; color: var(--tt-text-muted); font-size: 14px; }
.hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 14px 0; border-bottom: 1px solid var(--tt-hairline); }
.hrow:first-of-type { border-top: 1px solid var(--tt-hairline); }
.hrow .ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--tt-radius-sm); background: var(--tt-surface-sunken); color: var(--tt-accent-text); font-weight: 700; font-size: 13px; }
.hrow .info { flex: 1 1 260px; min-width: 0; } .hrow .info b { font-weight: 600; } .hrow .info p { margin-top: 2px; font-size: 13px; }
.list { margin-top: 20px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tt-text-faint); vertical-align: 1px; margin-right: 6px; }
.status-dot.on { background: var(--tt-success); }

.backdrop { position: fixed; inset: 0; display: grid; place-items: center; background: var(--tt-overlay); padding: 20px 20px 90px; }
.dialog { width: min(480px, 100%); max-height: calc(100vh - 110px); overflow-y: auto; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); padding: 24px; }
.dialog h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.intro { margin: 0; color: var(--tt-text-muted); font-size: 13px; }
.fields { display: grid; gap: 14px; margin-top: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.label { font-size: 13px; font-weight: 600; } .optional { color: var(--tt-text-faint); font-weight: 400; }
.desc { margin: 0; color: var(--tt-text-muted); font-size: 12px; }
.input, .select { width: 100%; min-height: 36px; border: 1px solid var(--tt-border-faint); border-radius: var(--tt-radius-md); background: var(--tt-surface-sunken); padding: 4px 12px; color: var(--tt-text); font: 500 13.5px Figtree, system-ui, sans-serif; }
.select { width: auto; min-height: 34px; padding-right: 8px; }
.pair { display: grid; grid-template-columns: minmax(0,1fr) 110px; gap: 12px; }
.advanced { color: var(--tt-text-muted); font-size: 13px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.button { display: inline-flex; min-height: 34px; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); padding: 0 14px; background: transparent; color: var(--tt-text-2); cursor: pointer; font: 500 13.5px Figtree, system-ui, sans-serif; white-space: nowrap; }
.button:hover:not(:disabled) { border-color: var(--tt-text-faint); color: var(--tt-text); }
.button:disabled { cursor: not-allowed; opacity: .45; }
.button.primary { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.actions .button { min-height: 44px; padding: 0 22px; }
.button.small { min-height: 28px; padding: 0 12px; font-size: 12.5px; }
.link { color: var(--tt-accent-text); font-size: 12.5px; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; text-decoration: underline; }
.notice { display: grid; gap: 8px; margin-top: 14px; border-left: 2px solid var(--tt-accent); border-radius: var(--tt-radius-sm); background: var(--tt-surface-sunken); padding: 10px 12px; font-size: 13px; }
.notice.done { border-left-color: var(--tt-success); }
.notice p { margin: 0; }
.notice .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.muted { color: var(--tt-text-muted); } .faint { color: var(--tt-text-faint); }
.spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

/* The device picker: a button that opens a list of what Sotto can see. */
.picker { position: relative; }
.picker-button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; border: 1px solid var(--tt-border-faint); border-radius: var(--tt-radius-md); background: var(--tt-surface-sunken); padding: 6px 12px; color: var(--tt-text); font: inherit; text-align: left; cursor: pointer; }
.picker-button:hover { border-color: var(--tt-border); }
.picker-button .main { flex: 1; min-width: 0; }
.picker-button .main small { display: block; color: var(--tt-text-muted); font-size: 12px; }
.picker-button .chev { color: var(--tt-text-muted); }
.menu { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; max-height: 330px; overflow: auto; margin: 0; border: 1px solid var(--tt-border); border-radius: var(--tt-radius-md); background: var(--tt-surface-overlay); box-shadow: var(--tt-shadow-overlay); padding: 4px; list-style: none; }
.menu .group { padding: 8px 10px 4px; color: var(--tt-text-faint); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.menu [role='option'] { display: grid; grid-template-columns: 14px 1fr; gap: 0 8px; align-items: baseline; border-radius: var(--tt-radius-sm); padding: 7px 10px; cursor: pointer; }
.menu [role='option'][aria-selected='true'], .menu [role='option']:hover:not([aria-disabled='true']) { background: var(--tt-selected); }
.menu [role='option'][aria-disabled='true'] { cursor: default; }
.menu [role='option'][aria-disabled='true'] b { color: var(--tt-text-muted); }
.menu [role='option'] b { font-weight: 600; font-size: 13.5px; }
.menu [role='option'] small { grid-column: 2; color: var(--tt-text-muted); font-size: 12px; }
.menu .why { color: var(--tt-text-faint); }
.menu .other b { font-weight: 500; }
.menu .foot { margin: 4px 0 0; border-top: 1px solid var(--tt-hairline); padding: 8px 10px 6px; color: var(--tt-text-muted); font-size: 12px; }

.tailscale { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 14px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); padding: 10px 10px 10px 12px; font-size: 13px; }
.tailscale p { flex: 1 1 240px; margin: 0; }

.choices { display: grid; gap: 10px; margin-top: 16px; }
.choice { display: grid; grid-template-columns: 18px 1fr; gap: 4px 10px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); padding: 12px; cursor: pointer; }
.choice[aria-checked='true'] { border-color: var(--tt-accent); background: var(--tt-selected); }
.choice .dot { width: 16px; height: 16px; margin-top: 1px; border: 1.5px solid var(--tt-text-faint); border-radius: 50%; }
.choice[aria-checked='true'] .dot { border: 5px solid var(--tt-accent); }
.choice h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.choice p { grid-column: 2; margin: 0; color: var(--tt-text-muted); font-size: 12.5px; }
.choice .row { grid-column: 2; display: flex; align-items: center; gap: 8px; margin-top: 6px; }

.icon { display: inline-grid; flex: 0 0 auto; place-items: center; width: 20px; height: 20px; }
.icon svg { width: 16px; height: 16px; }
.icon.done { color: var(--tt-success); } .icon.waiting { color: var(--tt-accent-text); } .icon.todo { color: var(--tt-text-faint); }
.summary { display: flex; align-items: center; gap: 10px; margin-top: 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); padding: 8px 12px; font-size: 13px; }
.summary b { font-weight: 600; }
.agent { display: flex; align-items: center; gap: 10px; margin-top: 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); padding: 10px 10px 10px 12px; font-size: 13px; }
.agent p { flex: 1; margin: 0; }
.steps { display: grid; gap: 2px; margin: 16px 0 0; padding: 0; list-style: none; }
.step { display: grid; grid-template-columns: 20px 1fr; gap: 4px 10px; align-items: start; padding: 7px 0; }
.step .title { font-size: 13.5px; line-height: 20px; } .step.todo .title { color: var(--tt-text-muted); }
.step .by { color: var(--tt-text-faint); font-size: 12px; }
.step .detail { grid-column: 2; } .step .detail .notice { margin-top: 4px; }

.proto-bar { position: fixed; z-index: 100; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; border-radius: 999px; background: #ffd84d; color: #111; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.4); font: 600 12.5px system-ui, sans-serif; white-space: nowrap; }
.proto-bar button { border: 0; border-radius: 999px; background: transparent; color: #111; padding: 6px 8px; font: inherit; cursor: pointer; }
.proto-bar button[aria-pressed='true'] { background: #111; color: #ffd84d; }
.proto-bar .sep { width: 1px; height: 20px; margin: 0 4px; background: rgba(0,0,0,.25); }
</style>
</head>
<body>
<main class="page" id="page"></main>
<div class="backdrop" id="backdrop" role="presentation"><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
<nav class="proto-bar" aria-label="Prototype controls" id="bar"></nav>
<script>
const MOMENTS = [['page', 'Hosts page'], ['pick', 'Pick a device'], ['off', 'Tailscale off'], ['missing', 'No Tailscale'], ['other', 'Another SSH host'], ['working', 'Agent working'], ['done', 'Done']]
const params = new URLSearchParams(location.search)
let moment = MOMENTS.some(([key]) => key === params.get('moment')) ? params.get('moment') : 'pick'
let theme = params.get('theme') === 'light' ? 'light' : 'dark'
let choice = 'agent'
const MODEL = 'Claude Opus 5.5'

// This computer's real `tailscale status --json` and SSH configuration, trimmed to what the list shows.
const DEVICES = [
  { name: 'forge', os: 'Linux', online: true, tags: ['Tailscale SSH', 'SSH configuration'] },
  { name: 'pihole', os: 'Linux', online: true, tags: ['Tailscale, SSH server not checked'] },
  { name: 'omarchy', os: 'Linux', online: false, tags: ['Tailscale SSH'], why: 'Offline, last seen 8 days ago' },
  { name: 'DESKTOP-8NPFSBM', os: 'Windows', online: false, tags: ['Tailscale'], why: 'Offline, last seen 13 days ago' },
  { name: 'iphone-15-pro', os: 'iOS', online: true, tags: ['Tailscale'], why: 'A phone cannot run the host' },
]
const SSH_ONLY = [{ name: 'spark', os: '', online: null, tags: ['SSH configuration'] }]
const tailscaleOn = () => moment !== 'off' && moment !== 'missing'

const ICONS = {
  done: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  waiting: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>',
  todo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5"/></svg>',
}
const WORD = { done: 'Done', waiting: 'Waiting for you', todo: 'Not started' }
const icon = status => `<span class="icon ${status}" role="img" aria-label="${WORD[status]}">${ICONS[status]}</span>`
const dot = online => online === null ? '<span></span>' : `<span class="status-dot ${online ? 'on' : ''}" role="img" aria-label="${online ? 'Online' : 'Offline'}"></span>`
const meta = device => [device.os, ...device.tags].filter(Boolean).join(' · ')

// The Tailscale line: the same words on the Hosts page and in the dialog.
function tailscaleLine(where) {
  if (moment === 'off') return `<p><b>Tailscale is off on this computer.</b> Connect to see the machines on your tailnet.</p><button class="button ${where === 'dialog' ? 'primary ' : ''}small" data-connect>Connect to Tailscale</button>`
  if (moment === 'missing') return `<p><b>Tailscale is not installed.</b> Any machine you reach over SSH works; Tailscale makes your other machines easy to reach.</p><button class="button small" data-get>Get Tailscale</button>`
  return `<p><span class="status-dot on"></span>Tailscale is connected as millZach. Sotto can see 5 devices on your tailnet.</p>`
}

function page() {
  return `<div class="heading"><div><h3>Hosts</h3><p>Machines Sotto can run threads on. Threads on a host keep working when this computer sleeps.</p></div><button class="button" data-add>+ Add host</button></div>
    <div class="list">
      <div class="hrow"><span class="ico">⌂</span><div class="info"><b>This computer</b><p>Threads run here.</p></div></div>
      <div class="hrow"><span class="ico">TS</span><div class="info"><b>Tailscale</b>${tailscaleOn() ? `<p><span class="status-dot on"></span>Connected as millZach · 5 devices on your tailnet</p>` : moment === 'off' ? '<p>Off on this computer. Connect to reach your other machines.</p>' : '<p>Not installed. Any machine you reach over SSH works without it.</p>'}</div>
        ${tailscaleOn() ? '' : moment === 'off' ? '<button class="button small" data-connect>Connect to Tailscale</button>' : '<button class="button small" data-get>Get Tailscale</button>'}</div>
    </div>`
}

function deviceMenu() {
  const usable = (tailscaleOn() ? DEVICES : DEVICES.filter(d => d.tags.includes('SSH configuration') || d.tags.includes('Known hosts')).map(d => ({ ...d, online: null, tags: d.tags.filter(t => !t.startsWith('Tailscale')) })))
  const pickable = [...usable.filter(d => !d.why), ...SSH_ONLY]
  const greyed = usable.filter(d => d.why)
  const option = (device, index) => `<li role="option" id="opt-${index}" aria-selected="${index === 0 && moment === 'pick'}"${device.why ? ' aria-disabled="true"' : ''}>${dot(device.online)}<b>${device.name}</b>
    <small>${meta(device)}${device.why ? ` · <span class="why">${device.why}</span>` : ''}</small></li>`
  return `<ul class="menu" role="listbox" aria-label="Devices Sotto can see">
    <li class="group" role="presentation">Can connect</li>${pickable.map(option).join('')}
    ${greyed.length ? `<li class="group" role="presentation">Can't use now</li>${greyed.map((d, i) => option(d, 50 + i)).join('')}` : ''}
    <li role="option" class="other" aria-selected="false" data-other><span></span><b>Another SSH host…</b><small>Type a host name or user@server</small></li>
    <li class="foot" role="presentation">${tailscaleOn() ? "Don't see your machine? Install Tailscale on it and sign in as millZach." : 'Connect to Tailscale to see the machines on your tailnet here.'}</li></ul>`
}

function hostField() {
  if (moment === 'other') return `<div class="field"><label class="label" for="host">SSH host</label>
    <input class="input" id="host" value="zach@10.0.0.42" autofocus><p class="desc">A host name, an alias from your SSH configuration or user@server. <button class="link" data-back>Choose from your devices</button></p></div>
    <div class="pair"><div class="field"><label class="label" for="user">Username <span class="optional">(optional)</span></label><input class="input" id="user" placeholder="From your SSH configuration"></div>
    <div class="field"><label class="label" for="port">Port <span class="optional">(optional)</span></label><input class="input" id="port" placeholder="22"></div></div>`
  const open = moment !== 'page'
  const chosen = tailscaleOn() ? DEVICES[0] : { name: 'forge', os: '', tags: ['SSH configuration'], online: null }
  return `<div class="field"><span class="label" id="device-label">Device</span>
    <div class="picker"><button class="picker-button" aria-haspopup="listbox" aria-expanded="${open}" aria-labelledby="device-label device-value" id="device-value">
      ${dot(chosen.online)}<span class="main"><b>${chosen.name}</b><small>${meta(chosen)}</small></span><span class="chev" aria-hidden="true">▾</span></button>
      ${open && moment === 'pick' || open && moment === 'off' || open && moment === 'missing' ? deviceMenu() : ''}</div></div>`
}

function start() {
  const agent = choice === 'agent'
  return `<h2 id="dialog-title">Add host</h2><p class="intro">Pick a machine Sotto can reach over SSH.</p>
    ${tailscaleOn() ? '' : `<div class="tailscale">${tailscaleLine('dialog')}</div>`}
    <form class="fields" onsubmit="return false">${hostField()}</form>
    <div class="choices" role="radiogroup" aria-label="How to add the host">
      <div class="choice" role="radio" tabindex="${agent ? 0 : -1}" aria-checked="${agent}" data-choice="agent"><span class="dot"></span><h3>Have my agent set this up</h3>
        <p>For a machine without the host yet. The agent installs it, fixes what is missing and adds the host. It works in a new thread, and you answer each command it wants to run.</p>
        ${agent ? `<div class="row"><span class="muted" style="font-size:12.5px">Model</span><select class="select" aria-label="Model for the setup thread"><option>${MODEL}</option><option>GPT-6 (Codex)</option><option>Grok Build</option></select></div>` : ''}</div>
      <div class="choice" role="radio" tabindex="${agent ? -1 : 0}" aria-checked="${!agent}" data-choice="self"><span class="dot"></span><h3>Add it</h3>
        <p>For a machine that already has the host. Sotto connects now and says what to fix if a step fails.</p></div>
    </div>
    <div class="actions"><button class="button">Cancel</button><button class="button primary">${agent ? 'Start setup' : 'Add host'}</button></div>`
}

function progress() {
  const done = moment === 'done'
  const steps = [['Reached forge'], ['Approved in Tailscale'], ['Signed in as zach'], ['Installed Node 24', 'by the agent'], ['Copying the host files', 'by the agent', 'Copied the host files'], ['Start the host', '', 'Host started'], ['Pair this computer', '', 'Paired this computer']]
  const items = steps.map(([title, by, doneTitle], index) => {
    const status = done || index < 4 ? 'done' : index === 4 ? 'waiting' : 'todo'
    const text = status === 'done' ? (doneTitle ?? title) : status === 'todo' && index === 4 ? 'Copy the host files' : title
    const extra = status === 'waiting' ? `<div class="detail"><div class="notice" role="status"><p>The agent wants to run a command on forge. Answer it in the thread to carry on.</p><div class="row"><button class="button small" data-thread>Open thread</button></div></div></div>` : ''
    return `<li class="step ${status}"${status === 'waiting' ? ' aria-current="step"' : ''}>${icon(status)}<span class="title">${text}${by && status === 'done' ? ` <span class="by">${by}</span>` : ''}</span>${extra}</li>`
  }).join('')
  return `<h2 id="dialog-title">${done ? 'forge is connected' : 'Setting up forge'}</h2>
    <div class="summary"><span class="status-dot on"></span><b>forge</b>&nbsp;<span class="muted">· Linux · Tailscale SSH · SSH configuration</span></div>
    ${done ? '' : `<div class="agent"><p><b>${MODEL}</b> is setting up forge in the thread <b>Set up forge</b>. You answer each command it wants to run.</p><button class="button small" data-thread>Open thread</button></div>`}
    <ol class="steps" aria-label="Setup steps">${items}</ol>
    ${done ? `<div class="notice done" role="status"><p>forge is added and connected. ${MODEL} set it up in <button class="link" data-thread>Set up forge</button>; the thread stays in your Threads list until you archive it.</p></div>
      <div class="actions"><button class="button primary">Done</button></div>`
      : '<div class="actions"><button class="button" title="Closes this dialog. The thread keeps going.">Close</button><button class="button" data-stop>Stop setup</button></div>'}`
}

function render() {
  document.documentElement.dataset.theme = theme
  document.getElementById('page').innerHTML = page()
  const backdrop = document.getElementById('backdrop')
  backdrop.hidden = moment === 'page'
  backdrop.style.display = moment === 'page' ? 'none' : ''
  document.getElementById('page').setAttribute('aria-hidden', String(moment !== 'page'))
  document.getElementById('dialog').innerHTML = moment === 'working' || moment === 'done' ? progress() : start()
  document.getElementById('bar').innerHTML = MOMENTS.map(([key, name], i) => `<button data-moment="${key}" aria-pressed="${key === moment}">${i + 1} ${name}</button>`).join('')
    + `<span class="sep"></span><button data-theme>T ${theme === 'dark' ? 'Light' : 'Dark'}</button>`
  history.replaceState(null, '', `?moment=${moment}&theme=${theme}`)
}
const go = key => { moment = key; render() }
document.addEventListener('click', event => {
  const target = event.target.closest('button, [data-choice], [data-other], [role="option"]')
  if (!target) return
  if (target.dataset.moment) return go(target.dataset.moment)
  if ('theme' in target.dataset) { theme = theme === 'dark' ? 'light' : 'dark'; return render() }
  if ('add' in target.dataset) return go('pick')
  if ('connect' in target.dataset) { target.textContent = 'Connecting…'; target.disabled = true; setTimeout(() => go(moment === 'page' ? 'page' : 'pick'), 900); return }
  if ('get' in target.dataset) return alert('Opens tailscale.com/download in your browser.')
  if ('other' in target.dataset) return go('other')
  if ('back' in target.dataset) return go('pick')
  if (target.dataset.choice && !event.target.closest('select')) { choice = target.dataset.choice; return render() }
  if ('thread' in target.dataset) return alert('Opens the thread "Set up forge" on the Threads page.')
  if ('stop' in target.dataset) return alert('Stops the thread. Nothing is saved as a host; what the agent already installed on forge stays.')
  if (target.classList.contains('primary') && target.textContent === 'Start setup') return go('working')
})
document.addEventListener('keydown', event => {
  if (event.target.closest('input, textarea, select, [contenteditable]')) return
  const n = Number(event.key)
  if (n >= 1 && n <= MOMENTS.length) go(MOMENTS[n - 1][0])
  else if (event.key.toLowerCase() === 't') { theme = theme === 'dark' ? 'light' : 'dark'; render() }
})
render()
</script>
</body>
</html>
