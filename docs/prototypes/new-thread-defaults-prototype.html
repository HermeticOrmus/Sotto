<!doctype html>
<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything.

  Question: Zach asked for starting a new thread in an existing project to skip the "New thread" dialog and open
  straight away on defaults set in Settings > Agents: model, effort, and a new permissions default. Decided with him
  (September 26, 2026): only the project buttons skip the dialog (the sidebar's top New thread button still asks
  which project, with no options); new threads get their own defaults, apart from personal chats' reasoning model
  and effort; one permissions default with the nearest fit per provider; the thread opens empty with the composer
  focused. Open: what the "New threads" group in Settings > Agents should look like.

  Three layouts on ?variant=a|b|c, cycled by the bar at the top (or the arrow keys outside a field):
   a  Rows.      Three ordinary Settings rows under a "New threads" heading, like every other Settings row.
   b  Chips.     One row, "New threads start with", holding the same three chips the composer shows.
   c  Preview.   The three rows beside a small preview of a new thread's composer, updating as you choose.

  Try: change the defaults in Settings, then press the pen on "Sotto test" in the sidebar (Threads), or the top
  New thread button. Pick Grok with "Allow edits" to see the nearest fit.

  Run: node docs/prototypes/composer-selectors-serve.mjs, then open
  http://127.0.0.1:4173/docs/prototypes/new-thread-defaults-prototype.html?variant=a
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>New thread defaults - prototype</title>
<style>
  @font-face { font-family: 'Figtree'; font-weight: 300 900; font-display: swap; src: url('../../src/renderer/src/assets/fonts/figtree-latin.woff2') format('woff2'); }
  :root { --bg:#000; --side:#0f1012; --surface:#15171a; --elev:#1b1d21; --hair:#26292e; --border:#34383e; --text:#f1f2f3; --text2:#c3c7cc; --muted:#979ca4; --hover:rgb(255 255 255/6%); --accent:#46b8a8; --accent-ink:#021412; --sel:#12302b; --sel-b:#2b5a51; --focus:#5fc6b7; --warn:#f0b45c; --shadow:0 18px 50px rgb(0 0 0/55%); }
  :root[data-theme=light] { --bg:#fafaf9; --side:#f1f2f0; --surface:#fff; --elev:#fff; --hair:#dfe2df; --border:#cdd2cf; --text:#15191a; --text2:#3a4144; --muted:#5f676b; --hover:rgb(0 0 0/5%); --accent:#1f7a6c; --accent-ink:#fff; --sel:#e1ece8; --sel-b:#b3cdc4; --focus:#1f7a6c; --warn:#8a5200; --shadow:0 18px 50px rgb(0 0 0/18%); }
  * { box-sizing:border-box; } html, body { height:100%; }
  body { margin:0; display:grid; grid-template-columns:260px minmax(0,1fr); background:var(--bg); color:var(--text); font:14px/1.45 Figtree, "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  button, select { font:inherit; color:inherit; } :focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  nav.side { display:flex; flex-direction:column; background:var(--side); border-right:1px solid var(--hair); min-height:0; }
  .brand { display:flex; align-items:center; gap:8px; height:48px; padding:0 10px 0 14px; font-weight:600; }
  .brand i { width:18px; height:18px; border-radius:5px; background:var(--accent); } .brand .sp { margin-left:auto; }
  .ib { display:inline-grid; place-items:center; width:28px; height:28px; border:0; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer; } .ib:hover { background:var(--hover); color:var(--text); }
  .proj { display:flex; align-items:center; gap:6px; padding:8px 8px 4px 14px; color:var(--text2); font-weight:600; font-size:13px; } .proj .sp { margin-left:auto; }
  .threads { list-style:none; margin:0; padding:0 8px; }
  .threads button { width:100%; text-align:left; padding:7px 10px; border:1px solid transparent; border-radius:8px; background:transparent; cursor:pointer; color:var(--text2); }
  .threads button[aria-current] { background:var(--sel); border-color:var(--sel-b); color:var(--text); } .threads .s { display:block; color:var(--muted); font-size:12px; }
  .foot { margin-top:auto; display:flex; gap:6px; padding:10px; } .foot button { flex:1; height:32px; border:1px solid var(--border); border-radius:8px; background:transparent; cursor:pointer; }
  .foot button[aria-pressed=true] { background:var(--sel); border-color:var(--sel-b); }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .strip { display:flex; align-items:center; gap:8px; height:48px; padding:0 18px; border-bottom:1px solid var(--hair); } .strip h1 { margin:0; font-size:15px; font-weight:600; } .strip .c { color:var(--muted); font-size:13px; }
  .convo { flex:1; overflow:auto; display:grid; place-items:center; color:var(--muted); text-align:center; }
  .convo strong { display:block; color:var(--text); font-size:16px; margin-bottom:4px; }
  .compose { padding:0 20px 16px; } .composer { max-width:720px; margin:0 auto; border:1px solid var(--border); border-radius:14px; padding:12px 14px 10px; background:var(--surface); }
  .composer textarea { width:100%; min-height:44px; border:0; resize:none; background:transparent; color:var(--text); font:inherit; outline:none; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 10px; border:1px solid var(--border); border-radius:999px; background:transparent; color:var(--text2); font-size:12.5px; cursor:pointer; }
  .chip select { border:0; background:transparent; color:inherit; font-size:12.5px; cursor:pointer; appearance:none; padding-right:12px; background-image:linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position:calc(100% - 7px) 55%, calc(100% - 3px) 55%; background-size:4px 4px; background-repeat:no-repeat; }
  .chip select option { background:var(--surface); color:var(--text); }
  .note { max-width:720px; margin:6px auto 0; color:var(--muted); font-size:12px; }
  .note b { color:var(--warn); font-weight:600; }
  /* settings */
  .settings { flex:1; overflow:auto; padding:30px 40px 60px; } .settings h2 { margin:0; font-size:26px; } .settings .sub { color:var(--muted); margin:4px 0 20px; }
  .group { max-width:820px; } .group h3 { margin:26px 0 2px; font-size:15px; } .group .gsub { color:var(--muted); font-size:13px; margin:0 0 6px; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:center; padding:16px 0; border-top:1px solid var(--hair); }
  .row .l strong { display:block; font-weight:600; } .row .l span { color:var(--muted); font-size:13px; }
  .row select { width:100%; height:38px; padding:0 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
  .row select option { background:var(--surface); }
  .row.chips-row { grid-template-columns:minmax(0,1fr) auto; }
  .row .chip select { width:auto; height:auto; border:0; padding:0 14px 0 0; background-color:transparent; }
  .preview-wrap { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px; align-items:start; max-width:980px; }
  .preview { position:sticky; top:10px; margin-top:34px; border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--elev); }
  .preview .t { color:var(--muted); font-size:12px; margin-bottom:8px; } .preview .fake { border:1px solid var(--border); border-radius:12px; padding:10px 12px 8px; color:var(--muted); font-size:13px; background:var(--surface); }
  .preview .fake .chips { margin-top:18px; }
  .fit { color:var(--muted); font-size:12px; margin-top:6px; }
  /* chooser */
  dialog { border:1px solid var(--border); border-radius:16px; background:var(--elev); color:var(--text); padding:0; width:min(460px, 92vw); box-shadow:var(--shadow); }
  dialog::backdrop { background:rgb(0 0 0/45%); }
  dialog header { display:flex; align-items:center; padding:16px 16px 6px 20px; font-size:18px; font-weight:600; } dialog header .ib { margin-left:auto; }
  dialog p { margin:0 20px 10px; color:var(--muted); font-size:13px; }
  dialog ul { list-style:none; margin:0; padding:4px 10px 14px; } dialog li button { width:100%; text-align:left; padding:10px 12px; border:0; border-radius:10px; background:transparent; cursor:pointer; }
  dialog li button:hover, dialog li button:focus-visible { background:var(--hover); } dialog li .p { display:block; color:var(--muted); font-size:12px; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--elev); border:1px solid var(--border); border-radius:10px; padding:8px 14px; box-shadow:var(--shadow); font-size:13px; }
  .proto { position:fixed; z-index:100; right:12px; top:8px; display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:999px; background:#ff3d7f; color:#fff; font:600 12px/1 system-ui, sans-serif; box-shadow:0 6px 24px rgb(0 0 0/35%); }
  .proto button { height:26px; padding:0 10px; border:0; border-radius:999px; background:rgb(255 255 255/22%); color:#fff; font:inherit; cursor:pointer; }
  .proto .v { min-width:110px; text-align:center; }
</style>
</head>
<body>
<nav class="side" aria-label="Sidebar">
  <div class="brand"><i></i>Sotto<span class="sp"></span><button class="ib" id="topNew" aria-label="New thread" title="New thread">✎</button></div>
  <div class="proj">▾ Sotto test<span class="sp"></span><button class="ib" data-new-in="sotto" aria-label="New thread in Sotto test" title="New thread here">✎</button></div>
  <ul class="threads" id="list-sotto"></ul>
  <div class="proj">▾ Fieldnotes<span class="sp"></span><button class="ib" data-new-in="field" aria-label="New thread in Fieldnotes" title="New thread here">✎</button></div>
  <ul class="threads" id="list-field"></ul>
  <div class="foot"><button id="goThreads" aria-pressed="false">Threads</button><button id="goSettings" aria-pressed="true">Settings</button></div>
</nav>
<main id="main"></main>
<dialog id="chooser" aria-label="New thread"><header>New thread<button class="ib" value="cancel" id="closeChooser" aria-label="Close">✕</button></header>
  <p>Choose the project. The thread opens with your defaults from Settings &gt; Agents.</p>
  <ul><li><button data-choose="sotto">Sotto test<span class="p">D:\Talk to Text Application</span></button></li><li><button data-choose="field">Fieldnotes<span class="p">D:\Fieldnotes</span></button></li></ul></dialog>
<div class="proto" role="toolbar" aria-label="Prototype controls"><button id="prev" aria-label="Previous variant">&larr;</button><span class="v" id="vl"></span><button id="next" aria-label="Next variant">&rarr;</button><button id="theme">Light</button></div>
<script>
const V = { a: 'Rows', b: 'Chips', c: 'Preview' }
const MODELS = [
  { id: 'claude-sonnet', name: 'Claude Sonnet 5', provider: 'Claude', efforts: ['Low', 'Medium', 'High', 'Max'], modes: ['ask', 'edits', 'auto', 'full'] },
  { id: 'codex-gpt', name: 'GPT-6 Astra (Codex)', provider: 'Codex', efforts: ['Low', 'Medium', 'High', 'Extra high'], modes: ['ask', 'edits', 'auto', 'full'] },
  { id: 'grok', name: 'Grok 4.7', provider: 'Grok', efforts: ['Low', 'High'], modes: ['ask', 'auto', 'full'] },
  { id: 'devin', name: 'SWE-1.6 (Devin)', provider: 'Devin', efforts: [], modes: [] },
]
const MODE = { ask: 'Ask for approval', edits: 'Allow edits', auto: 'Auto', full: 'Full access' }
const ORDER = ['ask', 'edits', 'auto', 'full']
const q = new URLSearchParams(location.search)
const s = { variant: V[q.get('variant')] ? q.get('variant') : 'a', page: 'settings', defaults: { model: 'claude-sonnet', effort: 'High', mode: 'ask' },
  projects: { sotto: { name: 'Sotto test', threads: [{ id: 't1', title: 'Docs', model: 'claude-sonnet', effort: 'High', mode: 'ask' }] }, field: { name: 'Fieldnotes', threads: [] } }, focused: null, toast: '' }
const $ = x => document.querySelector(x)
const model = id => MODELS.find(m => m.id === id)
// Nearest fit: the chosen mode if the provider has it, else the closest safer one it does have.
function fit(m, mode) {
  if (!m.modes.length) return { mode: null, label: 'Its first profile', note: `${m.provider} uses its own permission profiles; a new thread starts on its first.` }
  if (m.modes.includes(mode)) return { mode, label: MODE[mode] }
  for (let i = ORDER.indexOf(mode); i >= 0; i--) if (m.modes.includes(ORDER[i])) return { mode: ORDER[i], label: MODE[ORDER[i]], note: `${m.provider} has no "${MODE[mode]}", so its threads start on "${MODE[ORDER[i]]}".` }
  return { mode: m.modes[0], label: MODE[m.modes[0]] }
}
function effortFor(m, effort) { return m.efforts.includes(effort) ? effort : m.efforts.at(-1) ?? null }
const opts = (list, cur) => list.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')
function selects(d, chip) {
  const m = model(d.model), f = fit(m, d.mode), e = effortFor(m, d.effort)
  const ms = `<select aria-label="Default model for new threads" data-set="model">${opts(MODELS.map(x => [x.id, x.name]), d.model)}</select>`
  const es = m.efforts.length ? `<select aria-label="Default reasoning effort for new threads" data-set="effort">${opts(m.efforts.map(x => [x, x]), e)}</select>` : `<select disabled aria-label="Default reasoning effort"><option>Provider default</option></select>`
  const ps = `<select aria-label="Default permissions for new threads" data-set="mode">${opts(ORDER.map(k => [k, MODE[k]]), d.mode)}</select>`
  return chip ? `<span class="chip">${ms}</span><span class="chip">${es}</span><span class="chip">${ps}</span>` : { ms, es, ps, f }
}
function settings() {
  const d = s.defaults, x = selects(d), f = x.f
  const fitLine = f.note ? `<div class="fit">${f.note}</div>` : ''
  const rows = `<div class="row"><div class="l"><strong>Model</strong><span>The model a new thread starts on.</span></div>${x.ms}</div>
    <div class="row"><div class="l"><strong>Reasoning effort</strong><span>Changes with the model: each offers its own levels.</span></div>${x.es}</div>
    <div class="row"><div class="l"><strong>Permissions</strong><span>What a new thread may do without asking. A provider without this choice uses its nearest safer one.</span>${fitLine}</div>${x.ps}</div>`
  const head = `<div class="group"><h3>New threads</h3><p class="gsub">A new thread in a project opens straight away with these. Change them for one thread under its composer.</p>`
  const chat = `<div class="group"><h3>Personal chats and reasoning</h3><div class="row"><div class="l"><strong>Reasoning account</strong></div><select><option>Claude subscription</option></select></div><div class="row"><div class="l"><strong>Reasoning model</strong><span>Personal chats and the coordinator.</span></div><select><option>Claude Sonnet 5</option></select></div><div class="row"><div class="l"><strong>Reasoning effort</strong></div><select><option>Medium</option></select></div></div>`
  let body
  if (s.variant === 'a') body = head + rows + '</div>' + chat
  else if (s.variant === 'b') body = `${head}<div class="row chips-row"><div class="l"><strong>New threads start with</strong><span>Model, reasoning effort and permissions, as the composer shows them.</span>${fitLine}</div><div class="chips">${selects(d, true)}</div></div></div>` + chat
  else body = `<div class="preview-wrap"><div>${head}${rows}</div>${chat}</div><aside class="preview" aria-label="What a new thread shows"><div class="t">A new thread will show</div><div class="fake">What would you like to do next?<div class="chips"><span class="chip">${model(d.model).name}</span><span class="chip">${effortFor(model(d.model), d.effort) ?? 'Provider default'}</span><span class="chip">${f.label}</span></div></div></aside></div>`
  return `<div class="strip"><h1>Settings</h1><span class="c">Agents</span></div><div class="settings"><h2>Agents</h2><div class="sub">Reasoning, new threads and projects</div>${body}</div>`
}
function thread() {
  const p = s.projects[s.focused.project], t = p.threads.find(x => x.id === s.focused.id), m = model(t.model), f = fit(m, t.mode)
  const chipSel = (list, cur, label, key) => `<span class="chip"><select aria-label="${label}" data-thread="${key}">${opts(list, cur)}</select></span>`
  const chips = chipSel(MODELS.map(x => [x.id, x.name]), t.model, 'Model', 'model') + (m.efforts.length ? chipSel(m.efforts.map(x => [x, x]), effortFor(m, t.effort), 'Reasoning effort', 'effort') : '<span class="chip">Provider default</span>') + (m.modes.length ? chipSel(m.modes.map(k => [k, MODE[k]]), f.mode, 'Permissions', 'mode') : '<span class="chip">Ask first</span>')
  return `<div class="strip"><h1>${t.title}</h1><span class="c">/ ${p.name} · Project folder</span></div>
    <div class="convo"><div><strong>What is next for this thread?</strong>Write a prompt below to start. The thread names itself from the first exchange.</div></div>
    <div class="compose"><div class="composer"><textarea id="draft" aria-label="Message ${t.title}" placeholder="What would you like to do next?"></textarea><div class="chips">${chips}</div></div>${f.note ? `<div class="note">${f.note}</div>` : ''}</div>`
}
function render() {
  $('#vl').textContent = `${s.variant.toUpperCase()}: ${V[s.variant]}`
  for (const [id, p] of Object.entries(s.projects)) $(`#list-${id}`).innerHTML = p.threads.map(t => `<li><button data-open="${id}:${t.id}" ${s.page === 'thread' && s.focused?.id === t.id ? 'aria-current="true"' : ''}>${t.title}<span class="s">${model(t.model).provider}</span></button></li>`).join('')
  $('#goThreads').setAttribute('aria-pressed', String(s.page !== 'settings')); $('#goSettings').setAttribute('aria-pressed', String(s.page === 'settings'))
  $('#main').innerHTML = s.page === 'settings' || !s.focused ? settings() : thread()
  document.querySelector('.toast')?.remove()
  if (s.toast) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = s.toast; document.body.append(d); s.toast = '' }
}
function newThread(project) {
  const d = s.defaults, m = model(d.model), f = fit(m, d.mode)
  const t = { id: 'n' + Math.random().toString(36).slice(2, 7), title: 'New thread', model: d.model, effort: effortFor(m, d.effort), mode: f.mode }
  s.projects[project].threads.unshift(t); s.focused = { project, id: t.id }; s.page = 'thread'; render(); $('#draft')?.focus()
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.newIn) newThread(b.dataset.newIn)
  if (b.dataset.choose) { $('#chooser').close(); newThread(b.dataset.choose) }
  if (b.dataset.open) { const [project, id] = b.dataset.open.split(':'); s.focused = { project, id }; s.page = 'thread'; render() }
  if (b.id === 'topNew') $('#chooser').showModal()
  if (b.id === 'closeChooser') $('#chooser').close()
  if (b.id === 'goSettings') { s.page = 'settings'; render() }
  if (b.id === 'goThreads') { s.page = 'thread'; if (!s.focused) s.focused = { project: 'sotto', id: 't1' }; render() }
  if (b.id === 'theme') { const l = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = l ? 'light' : 'dark'; b.textContent = l ? 'Dark' : 'Light' }
})
document.addEventListener('change', e => {
  const el = e.target
  if (el.dataset.set) { s.defaults[el.dataset.set] = el.value; if (el.dataset.set === 'model') s.defaults.effort = effortFor(model(el.value), s.defaults.effort) ?? s.defaults.effort; s.toast = 'Setting saved.'; render() }
  if (el.dataset.thread) { const t = s.projects[s.focused.project].threads.find(x => x.id === s.focused.id); t[el.dataset.thread] = el.value; render() }
})
function cycle(dir) { const k = Object.keys(V); s.variant = k[(k.indexOf(s.variant) + dir + k.length) % k.length]; const u = new URL(location.href); u.searchParams.set('variant', s.variant); history.replaceState(null, '', u); render() }
$('#prev').onclick = () => cycle(-1); $('#next').onclick = () => cycle(1)
document.addEventListener('keydown', e => { if (e.target.closest('input, textarea, select, dialog')) return; if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') cycle(e.key === 'ArrowRight' ? 1 : -1) })
render()
</script>
</body>
</html>
