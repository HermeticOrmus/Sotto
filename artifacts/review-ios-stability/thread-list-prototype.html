<!doctype html>
<!-- PROTOTYPE: demonstrate Zach's chosen desktop-style settled disclosure in the existing iPhone list. No persistence or networking. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotto iPhone thread list prototype</title>
<style>
@font-face{font-family:Figtree;src:url('/apps/ios/Sotto/Resources/Figtree.ttf')}
:root{color-scheme:dark;--tt-background:#040507;--tt-surface:#111319;--tt-text:#f9f9fc;--tt-muted:#a0a5ae;--tt-border:#333642;--tt-accent:#47b8a9;--tt-warning:#f6bc69}
:root.light{color-scheme:light;--tt-background:#f9f8f5;--tt-surface:#efede8;--tt-text:#232323;--tt-muted:#68625b;--tt-border:#c4c1ba;--tt-accent:#23675b;--tt-warning:#835115}
*{box-sizing:border-box}body{margin:0;background:var(--tt-surface);color:var(--tt-text);font:17px Figtree,system-ui;display:grid;place-items:center;min-height:100vh;padding:30px 12px 80px}button,summary{font:inherit;cursor:pointer;color:inherit}button{background:none;border:0;min-height:44px}button:focus-visible,summary:focus-visible{outline:2px solid var(--tt-accent);outline-offset:3px}.phone{width:min(390px,100%);height:760px;max-height:calc(100vh - 115px);min-height:490px;background:var(--tt-background);border:1px solid var(--tt-border);border-radius:32px;display:flex;flex-direction:column;overflow:hidden}.top{padding:18px 22px 0;font-size:14px;display:flex;justify-content:space-between}.page{padding:12px 16px;overflow:auto;flex:1}h1{font-size:32px;margin:12px 0 20px}p{margin:0;color:var(--tt-muted);font-size:14px}.chips{display:flex;gap:8px;margin-bottom:20px}.chips button{background:var(--tt-surface);border-radius:30px;padding:0 16px;font-size:14px}.chips button[aria-pressed=true]{background:var(--tt-text);color:var(--tt-background)}.row{display:flex;align-items:center;gap:12px;min-height:74px;width:100%;text-align:left;border-bottom:1px solid var(--tt-border)}.badge{position:relative;background:var(--tt-surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.dot{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--tt-accent)}.warning{color:var(--tt-warning)}.label{flex:1;min-width:0}.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:14px;color:var(--tt-muted);margin-top:3px}.tabs{display:flex;border-top:1px solid var(--tt-border);background:var(--tt-surface);padding:8px 8px 19px}.tabs button{flex:1;font-size:12px;color:var(--tt-muted)}.tabs .chosen{color:var(--tt-accent)}details{margin-top:18px}summary{min-height:48px;display:flex;align-items:center;gap:8px;color:var(--tt-muted);font-weight:600;list-style:none}summary::before{content:'›';width:12px;font-size:24px}details[open] summary::before{content:'⌄'}summary span{margin-left:auto;font-weight:400}.tools{position:fixed;bottom:15px;display:flex;align-items:center;gap:12px;border:1px solid var(--tt-border);background:var(--tt-background);border-radius:20px;padding:2px 15px;font-size:13px}.notice{color:var(--tt-muted);font-size:13px}.empty{padding:20px 0}.back{color:var(--tt-accent)}@media(max-height:650px){body{padding-top:8px}.phone{border-radius:18px}.top{display:none}}
</style>
<main class="phone" aria-label="iPhone prototype"><div class="top"><b>9:41</b><span>▰ ▰</span></div><div class="page" id="page"></div><nav class="tabs"><button>♧<br>Needs you</button><button class="chosen">☷<br>Threads</button><button>▱<br>Computers</button></nav></main>
<aside class="tools"><span>Prototype · chosen grouping</span><button id="theme">Light</button></aside>
<script>
const rows=[['C','Fix iPhone connection','Working','Sotto',false],['C','Review the host setup','Needs your answer','Sotto',false],['G','Tune the motor controls','Done','Engineering',false],['C','Ship the sidebar update','Done','Sotto',true],['G','Review last week’s notes','Done','Engineering',true]];
function row(r){return `<button class="row" onclick="openThread('${r[1]}')"><span class="badge">${r[0]}${r[2]==='Working'?'<i class="dot"></i>':''}</span><span class="label"><div class="title">${r[1]}</div><div class="meta"><span class="${r[2].includes('answer')?'warning':''}">${r[2]}</span> · Laptop · ${r[3]}</div></span></button>`}
function list(){document.querySelector('#page').innerHTML=`<h1>Threads</h1><div class="chips"><button aria-pressed="true">All</button><button aria-pressed="false">Working</button><button aria-pressed="false">Done</button></div><div id="rows"></div>`;document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chips button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render(b.textContent)});render('All')}
function render(filter){const shown=rows.filter(r=>filter==='All'||(filter==='Done'?r[2]==='Done':r[2]!=='Done'));document.querySelector('#rows').innerHTML=shown.filter(r=>!r[4]).map(row).join('')+`<details><summary>Settled<span>${shown.filter(r=>r[4]).length}</span></summary>${shown.filter(r=>r[4]).map(row).join('')}</details>`}
function openThread(title){document.querySelector('#page').innerHTML=`<button class="back" onclick="list()">‹ Threads</button><h1>${title}</h1><p>Connected to Laptop</p><div class="empty">The current conversation opens here.</div><p class="notice">Prototype only. This does not connect or send a reply.</p>`}
document.querySelector('#theme').onclick=e=>{document.documentElement.classList.toggle('light');e.target.textContent=document.documentElement.classList.contains('light')?'Dark':'Light'};list();
</script></html>
