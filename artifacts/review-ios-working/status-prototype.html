<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype ? iPhone working state</title>
<style>:root{color-scheme:dark;--surface:#181b1b;--text:#eceded;--muted:#a9b3b1;--accent:#72bfb1;--line:#424a48}body{margin:32px auto;padding:0 24px;max-width:650px;background:var(--surface);color:var(--text);font:16px Figtree,'Segoe UI',sans-serif;line-height:1.5}h1{font-size:28px}p,dt{color:var(--muted)}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:18px;padding:8px 14px;cursor:pointer;margin:4px}button:focus-visible{outline:2px solid var(--accent)}button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}.row{padding:22px 0;border-block:1px solid var(--line);margin:24px 0}.state{color:var(--accent)}dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}dd{margin:0}nav{margin-top:24px}small{color:var(--muted)}@media(prefers-color-scheme:light){:root{color-scheme:light;--surface:#faf9f6;--text:#242727;--muted:#596561;--accent:#267364;--line:#bfc6c3}}@media(max-width:400px){body{margin:20px auto;padding:0 16px}dl{grid-template-columns:1fr}dd{margin-bottom:8px}}</style>
<small>Throwaway logic prototype</small><h1>When is a thread still working?</h1><p>Match desktop: finishing a turn does not mean Done while confirmed background work continues. A question takes priority. This explores status feedback on the existing iPhone row.</p>
<div class="row"><strong>Check the project</strong><div class="state" id="label"></div><small id="group"></small></div><dl id="facts"></dl><h2>Try a change</h2><div id="actions"></div><nav role="tablist" aria-label="Walkthroughs" id="tabs"></nav><p id="description"></p><div id="steps"></div>
<script>
const initial=()=>({turn:false,background:null,compacting:false,question:false});
function change(s,a){return {...s,...({start:{turn:true},finish:{turn:false},agent:{background:'Agent'},command:{background:'Command'},clear:{background:null},compact:{compacting:true},compacted:{compacting:false},ask:{question:true},answer:{question:false}}[a]||initial())}}
function words(s){if(s.question)return 'Asked you a question';if(s.compacting)return 'Compacting context';if(s.turn)return 'Working';if(s.background)return s.background==='Command'?'Waiting':'Working';return 'Done'}
const names={start:'Start turn',finish:'Finish turn',agent:'Start background agent',command:'Start background command',clear:'Finish background work',compact:'Start compaction',compacted:'Finish compaction',ask:'Ask a question',answer:'Answer question',reset:'Reset'};
const scenarios=[['Agent handoff','The parent finishes while its agent still works. Done appears only when both finish.',['start','agent','finish','clear']],['Background command','A command alone reads Waiting and stays in the Working list.',['command','ask','answer','clear']],['Compaction','Compaction remains visible as work in progress until it ends.',['compact','compacted']]];
let state=initial();function render(){const label=words(state);document.querySelector('#label').textContent=label+' on Laptop';document.querySelector('#group').textContent=label==='Done'?'Shown in Done':'Shown in Working';document.querySelector('#facts').innerHTML=[['Turn',state.turn?'Running':'Idle'],['Confirmed background work',state.background||'None'],['Compaction',state.compacting?'Running':'Not running'],['Question',state.question?'Needs your answer':'None']].map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')}
function button(action){const b=document.createElement('button');b.textContent=names[action];b.onclick=()=>{state=change(state,action);render()};return b}for(const action of Object.keys(names))document.querySelector('#actions').append(button(action));
function walkthrough(i){state=initial();render();document.querySelector('#description').textContent=scenarios[i][1];document.querySelector('#steps').replaceChildren(...scenarios[i][2].map(button));document.querySelectorAll('[role=tab]').forEach((b,n)=>b.setAttribute('aria-selected',String(i===n)))}scenarios.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.setAttribute('role','tab');b.onclick=()=>walkthrough(i);document.querySelector('#tabs').append(b)});walkthrough(0);
</script></html>
